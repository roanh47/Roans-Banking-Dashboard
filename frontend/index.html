<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roan's Banking Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css?v=2">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <svg class="brand-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M3 10h18M5 6l7-4 7 4M4 10v11M20 10v11M8 14v3M12 14v3M16 14v3"/></svg>
      <span class="brand-text">Banking Dashboard</span>
    </div>
    <nav class="sidebar-nav">
      <a href="#home" class="nav-item active" data-page="home">
        <span>Home</span>
      </a>
      <a href="#insights" class="nav-item" data-page="insights">
        <span>Insights</span>
      </a>
      <a href="#transactions" class="nav-item" data-page="transactions">
        <span>Transactions</span>
      </a>
      <a href="#connect" class="nav-item" data-page="connect">
        <span>Connect Bank</span>
      </a>
      <a href="#banks" class="nav-item" data-page="banks">
        <span>Banks</span>
      </a>
    </nav>
  </aside>

  <main class="main-content">
    <header class="page-header">
      <h1 id="page-title">Dashboard</h1>
      <div class="header-actions">
        <span class="last-sync">Last sync: --</span>
        <button class="btn btn-primary btn-sm" onclick="syncAll()">Sync now</button>
      </div>
    </header>
    <div id="page-content"></div>
  </main>
</div>

<!-- BankBot Chat Widget -->
<div id="bankbot-chat" class="bankbot-hidden">
  <div class="bankbot-header">
    <span>BankBot</span>
    <div class="bankbot-header-actions">
      <select id="bankbot-model" class="bankbot-model-select">
        <option value="">Loading models...</option>
      </select>
      <button id="bankbot-close" class="bankbot-btn-icon">&times;</button>
    </div>
  </div>
  <div id="bankbot-messages">
    <div class="bankbot-msg bankbot-bot">
      <div class="bankbot-bubble">Hi! I'm BankBot. Ask me anything about your finances.</div>
    </div>
  </div>
  <div class="bankbot-input-area">
    <input type="text" id="bankbot-input" placeholder="Ask about your money..." />
    <button id="bankbot-send" class="btn btn-primary btn-sm">Send</button>
  </div>
</div>
<button id="bankbot-toggle" class="bankbot-fab" onclick="document.getElementById('bankbot-chat').classList.toggle('bankbot-hidden')" style="position:fixed;bottom:24px;right:24px;z-index:1001">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
</button>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/date-fns@3.6.0/cdn/date-fns.min.js"></script>
<script src="/js/app.js?v=3"></script>
</body>
</html>
