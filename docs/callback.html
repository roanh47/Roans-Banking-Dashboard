<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roan's Banking — Authorizing...</title>
  <style>
    body {
      background: #0A0A0F;
      color: #E8E8F0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      text-align: center;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #1E1E2E;
      border-top-color: #6C5CE7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #FF6B6B; margin-top: 12px; }
    a { color: #6C5CE7; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Authorizing...</p>
    <p class="error" id="error" style="display:none;"></p>
    <p id="fallback" style="display:none; font-size:13px; color:#8888A0;">
      Not redirecting? <a href="#" id="manual">Click here</a>
    </p>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var error = params.get('error');

      if (error) {
        document.getElementById('error').textContent = 'Error: ' + error;
        document.getElementById('error').style.display = 'block';
        document.querySelector('.spinner').style.display = 'none';
        document.querySelector('p').textContent = 'Authorization failed.';
        return;
      }

      if (!code) {
        document.getElementById('error').textContent = 'No authorization code received.';
        document.getElementById('error').style.display = 'block';
        document.querySelector('.spinner').style.display = 'none';
        document.querySelector('p').textContent = 'Something went wrong.';
        return;
      }

      // Redirect to localhost — app or dashboard catches it
      var target = 'http://localhost:8200/api/auth/callback?code=' + encodeURIComponent(code);

      // Preserve any other params (state, etc.)
      params.forEach(function(value, key) {
        if (key !== 'code') {
          target += '&' + encodeURIComponent(key) + '=' + encodeURIComponent(value);
        }
      });

      document.getElementById('manual').href = target;

      // Redirect immediately
      window.location.replace(target);

      // Show fallback link after 3 seconds in case redirect is blocked
      setTimeout(function() {
        document.getElementById('fallback').style.display = 'block';
      }, 3000);
    })();
  </script>
</body>
</html>
