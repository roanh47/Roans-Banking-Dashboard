services:
  app:
    build: .
    container_name: roans-banking-dashboard
    ports:
      - "${APP_PORT:-8200}:8200"
    volumes:
      # === PRIVATE KEY ===
      # Place your .pem file at ./config/ (it's auto-detected by entrypoint)
      - ./config/:/app/config/
      # === ENVIRONMENT VARIABLES (REQUIRED) ===
      # Copy .env.example to .env and fill in your values
      - ./.env:/app/.env:ro
      # === PERSISTENT DATA ===
      # SQLite database survives container recreates
      - data:/app/data
    environment:
      - CONFIG_PATH=/app/.env
    restart: unless-stopped

volumes:
  data:
