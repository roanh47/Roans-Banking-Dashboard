services:
  app:
    build: .
    container_name: roans-banking-dashboard
    ports:
      - "${APP_PORT:-8200}:8200"
    volumes:
      # === PRIVATE KEY (REQUIRED) ===
      # Download from Enable Banking dashboard after creating an application.
      # Place at: ~/docker/Roans-Banking-Dashboard/config/private.pem
      # Or change the path below to wherever your .pem file is.
      - ./config/private.pem:/app/config/private.pem:ro
      # === ENVIRONMENT VARIABLES (REQUIRED) ===
      # Copy .env.example to .env and fill in your values.
      - ./.env:/app/.env:ro
    environment:
      - CONFIG_PATH=/app/.env
    restart: unless-stopped
